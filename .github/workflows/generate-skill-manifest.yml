name: Generate Skill Manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate skills-manifest.json
    runs-on: ubuntu-latest
    env:
      LAMELLA_CONTENT_ROOT: ${{ github.workspace }}/lamella-skills
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Checkout lamella-skills content root
        uses: actions/checkout@v6.0.2
        with:
          repository: basidiocarp/lamella-skills
          path: lamella-skills

      - name: Generate skills manifest
        run: bash scripts/generate-skill-manifest.sh generated/skills-manifest.json

      - name: Verify manifest is valid JSON
        run: python3 -c "import json,sys; d=json.load(open('generated/skills-manifest.json')); print('skills/agents/commands:', len(d.get('skills',[])), len(d.get('agents',[])), len(d.get('commands',[])))"

      - name: Verify committed manifest is up to date (drift check)
        run: |
          # Guard: fail loudly if the manifest path is gitignored — a gitignored
          # artifact can never drift-check because it is not tracked, which would
          # silently disable this gate on every run.
          if git check-ignore -q "generated/skills-manifest.json"; then
            echo "::error::generated/skills-manifest.json is gitignored — drift detection would be disabled. Fix .gitignore before proceeding."
            exit 1
          fi

          # Guard: the file must be tracked, otherwise there is nothing to drift
          # against and the generator's output is going unreviewed.
          if ! git ls-files --error-unmatch generated/skills-manifest.json >/dev/null 2>&1; then
            echo "::error::generated/skills-manifest.json is not tracked by git — commit it so CI can verify it stays current."
            exit 1
          fi

          # The "Generate skills manifest" step already regenerated the file in
          # place. If it now differs from the committed copy, the author forgot to
          # regenerate before pushing. We cannot push to a protected main from CI,
          # so fail and tell them to regenerate and include it in their PR.
          if ! git diff --exit-code -- generated/skills-manifest.json; then
            echo "::error::generated/skills-manifest.json is stale. Run 'bash scripts/generate-skill-manifest.sh generated/skills-manifest.json' and commit the result."
            exit 1
          fi

          echo "skills-manifest.json is up to date."
