name: Publish Marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish hosted Claude marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"

      - name: Run validators
        run: make validate

      - name: Resolve snapshot version
        run: |
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $BASE_VERSION" >&2
            exit 1
          fi
          echo "MARKETPLACE_VERSION=${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build hosted Claude marketplace
        run: |
          ./lamella build-marketplace \
            --version "${{ env.MARKETPLACE_VERSION }}" \
            --plugin-version "${{ env.MARKETPLACE_VERSION }}" \
            --source-mode git-subdir \
            --git-url "https://github.com/${{ github.repository }}.git" \
            --git-ref gh-pages

      - name: Publish marketplace branch
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/claude
          force_orphan: true
          enable_jekyll: false
