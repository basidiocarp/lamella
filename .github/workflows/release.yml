name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"

      - name: Run validators
        run: make validate

      - name: Resolve release version
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be valid semver after stripping leading v: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Build Claude marketplace
        run: ./lamella build-marketplace --version "${{ env.RELEASE_VERSION }}" --plugin-version "${{ env.RELEASE_VERSION }}"

      - name: Build Codex exports
        run: ./lamella build-codex

      - name: Package marketplace and Codex exports
        run: |
          cd dist
          tar czf "../lamella-claude-${{ github.ref_name }}.tar.gz" claude
          zip -qr "../lamella-claude-${{ github.ref_name }}.zip" claude
          tar czf "../lamella-codex-${{ github.ref_name }}.tar.gz" codex
          zip -qr "../lamella-codex-${{ github.ref_name }}.zip" codex
          cd ..

      - name: Upload Claude artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: lamella-claude
          path: |
            lamella-claude-${{ github.ref_name }}.tar.gz
            lamella-claude-${{ github.ref_name }}.zip

      - name: Upload Codex artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: lamella-codex
          path: |
            lamella-codex-${{ github.ref_name }}.tar.gz
            lamella-codex-${{ github.ref_name }}.zip

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Resolve release version
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be valid semver after stripping leading v: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS

      - name: Extract release notes from changelog
        run: |
          bash scripts/release/extract-changelog-entry.sh CHANGELOG.md "${RELEASE_VERSION}" > /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.6.1
        with:
          body_path: /tmp/release-notes.md
          files: release/*
