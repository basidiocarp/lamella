name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validators
        run: make validate

      - name: Build Claude marketplace
        run: ./lamella build-marketplace

      - name: Build Codex exports
        run: ./lamella build-codex

      - name: Package marketplace and Codex exports
        run: |
          tar czf "lamella-claude-${{ github.ref_name }}.tar.gz" dist/claude
          tar czf "lamella-codex-${{ github.ref_name }}.tar.gz" dist/codex

      - name: Upload Claude artifact
        uses: actions/upload-artifact@v7
        with:
          name: lamella-claude
          path: lamella-claude-${{ github.ref_name }}.tar.gz

      - name: Upload Codex artifact
        uses: actions/upload-artifact@v7
        with:
          name: lamella-codex
          path: lamella-codex-${{ github.ref_name }}.tar.gz

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS

      - name: Extract release notes from tag
        run: |
          NOTES=$(git tag -l --format='%(contents:body)' "${{ github.ref_name }}")
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: release/*
