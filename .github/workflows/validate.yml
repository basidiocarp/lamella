name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Run validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate commands
        run: node scripts/ci/validate-commands.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Validate rules
        run: node scripts/ci/validate-rules.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate manifests
        run: node scripts/ci/validate-manifests.js

      - name: Validate cross-references
        run: node scripts/ci/validate-xrefs.js
